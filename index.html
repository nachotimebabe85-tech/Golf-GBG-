<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GÖTEBORG CHAMPIONSHIP 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --gbg-blue: #002B5C;
            --bg-cream: #F9F8F6;
            --text-dark: #111827;
            --paper-color: #F1EDE2; 
            --border-color: rgba(0, 43, 92, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }

        /* --- STARTSIDA (GATEKEEPER) --- */
        #scorecardModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 15px;
            overflow: hidden;
        }

        .gatekeeper-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 43, 92, 0.95);
            background-image: url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply;
            z-index: -1; 
        }

        /* DET ANALOGA KORTET */
        .scorecard-box {
            background: var(--paper-color); padding: 45px 25px; max-width: 620px; width: 100%;
            border-radius: 2px; 
            box-shadow: 
                0 30px 70px rgba(0,0,0,0.6), 
                inset 0 0 40px rgba(0,0,0,0.08),
                2px 2px 0px rgba(255,255,255,0.5) inset;
            text-align: center; position: relative; overflow: hidden;
            border: 1px solid #D5D0C0;
            
            background-image: 
                linear-gradient(135deg, rgba(0,0,0,0.03) 0%, transparent 50%, rgba(0,0,0,0.03) 100%),
                radial-gradient(circle at 30% 20%, rgba(139,92,26,0.04) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.03) 0%, transparent 30%);
            
            opacity: 1; transform: translateY(0);
        }

        .coffee-stain {
            position: absolute; background: transparent;
            width: 90px; height: 85px; border-radius: 50%;
            border: 3px solid rgba(115, 80, 45, 0.08);
            top: -20px; right: -10px; transform: rotate(15deg);
            filter: blur(1px); pointer-events: none;
        }
        .coffee-stain::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            border-radius: 50%; border: 1px solid rgba(115, 80, 45, 0.04); top: 2px; left: 1px;
        }

        .scorecard-box h2 { font-size: 1.6rem; margin-bottom: 25px; color: var(--gbg-blue); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; opacity: 0.9; }
        
        .scorecard-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 0.8rem; font-family: 'Inter', sans-serif; background: rgba(255,255,255,0.3); box-shadow: inset 0 0 5px rgba(0,0,0,0.02); }
        .scorecard-table th, .scorecard-table td { border: 1px solid #A6AFB6; padding: 7px 4px; color: var(--gbg-blue); }
        .scorecard-table th { background: rgba(0, 43, 92, 0.04); font-weight: 900; letter-spacing: 0.5px; }
        
        /* Grafit/Blyertskänsla */
        .pencil-text { font-family: 'Caveat', cursive; font-size: 1.5rem; color: #2B2B2B; opacity: 0.85; text-shadow: 0.5px 0.5px 1px rgba(0,0,0,0.15); }
        .pencil-circle { display: inline-block; border: 1.5px solid rgba(43,43,43,0.7); border-radius: 50%; width: 22px; height: 22px; line-height: 19px; }
        .pencil-square { display: inline-block; border: 1.5px solid rgba(43,43,43,0.7); width: 22px; height: 22px; line-height: 19px; }

        .signature-area { margin-top: 25px; border-top: 1px dashed #A6AFB6; padding-top: 25px; position: relative;}
        .signature-area label { display: block; font-size: 0.75rem; color: var(--gbg-blue); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; opacity: 0.8; }
        
        .scorecard-box input {
            width: 85%; background: transparent; border: none; border-bottom: 2px solid rgba(43, 43, 43, 0.4);
            font-size: 2.6rem; text-align: center; color: #232323; outline: none;
            font-family: 'Caveat', cursive; padding-bottom: 2px; text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .btn-submit {
            background: var(--gbg-blue); color: white; border: none; padding: 14px 35px;
            font-size: 0.95rem; font-weight: 700; cursor: pointer; letter-spacing: 1.5px; margin-top: 25px; border-radius: 3px;
            font-family: 'Inter', sans-serif; text-transform: uppercase; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0, 43, 92, 0.2);
        }
        .btn-submit:hover { background: #001f42; transform: translateY(-1px); }

        .error-msg { color: #b91c1c; font-size: 0.85rem; margin-top: 15px; display: none; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- MAIN SITE --- */
        #mainContent { display: none; }
        
        /* NY FIX: Mobilanpassad hjälpklass för texten */
        .content-wrapper {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero {
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        /* UPPDATERAD: Mobilanpassad fontstorlek som inte bryter fult på telefonen */
        .hero h1 { font-size: clamp(2.3rem, 7vw, 5.5rem); color: var(--gbg-blue); line-height: 1.1; text-transform: uppercase; letter-spacing: -1px; }
        .hero p.welcome-msg { font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 30px; color: var(--text-dark); font-weight: 700; }
        .hero p.date { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.2rem; margin-top: 10px; opacity: 0.7; }

        /* NY DESIGN UTAN BILDER (Masters Program-stil) */
        .section-container {
            padding: 100px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .section-container:last-of-type { border-bottom: none; }

        .text-side { opacity: 0; transform: translateY(40px); }
        .text-side h3 { font-family: 'Inter', sans-serif; font-size: 0.9rem; color: #6b7280; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; font-weight: 700; }
        .text-side h2 { font-size: clamp(2.5rem, 5vw, 3.5rem); color: var(--gbg-blue); margin-bottom: 40px; line-height: 1.1; border-left: 3px solid var(--gbg-blue); padding-left: 20px; }
        
        .event-block { margin-bottom: 45px; }
        .event-block:last-child { margin-bottom: 0; }
        .event-block h4 { font-family: 'Inter', sans-serif; font-size: 1.2rem; color: var(--gbg-blue); margin-bottom: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .event-block p { font-size: 1.1rem; line-height: 1.75; color: #374151; font-weight: 400; }

        .divider { width: 40px; height: 1px; background: var(--gbg-blue); margin: 0 auto; opacity: 0.4; }

        /* RSVP SECTION */
        .rsvp-section { text-align: center; padding: 150px 20px 120px 20px; background: #fff; border-top: 1px solid var(--border-color); }
        .rsvp-section h2 { font-size: clamp(2.5rem, 6vw, 4rem); color: var(--gbg-blue); margin-bottom: 20px; text-transform: uppercase; }
        .rsvp-section p { font-size: 1.15rem; margin-bottom: 40px; color: #4b5563; max-width: 550px; margin-left: auto; margin-right: auto; line-height: 1.6; }
        .btn-rsvp {
            display: inline-block; background: var(--gbg-blue); color: white; padding: 20px 50px;
            font-size: 1.1rem; font-weight: 700; text-decoration: none; letter-spacing: 1.5px; transition: 0.3s;
            border-radius: 2px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0, 43, 92, 0.15);
        }
        .btn-rsvp:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 43, 92, 0.25); }

        @media (max-width: 600px) {
            .section-container { padding: 60px 0; }
            .text-side h2 { padding-left: 15px; }
            .btn-rsvp { width: 100%; text-align: center; padding: 18px 20px; }
        }
